[project]
name = "vision-model"
version = "0.4.0"
description = "Aerial object detection and geo-tagging pipeline (VisDrone / AU-AIR)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "torch>=2.2",
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "albumentations>=1.4",
    "pyproj>=3.6",
    "geographiclib>=2.0",
    "pymap3d>=3.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
]

[project.scripts]
vision-model-train = "vision_model.cli.train:main"
vision-model-infer = "vision_model.cli.infer:main"
vision-model-infer-video = "vision_model.cli.infer_video:main"
vision-model-geotag = "vision_model.cli.geotag:main"
vision-model-evaluate = "vision_model.cli.evaluate:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
