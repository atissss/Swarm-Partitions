[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-partitions"
version = "0.1.0"
description = "Mission partitioner and vision-model tooling for UAV workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "shapely",
    "scikit-learn",
    "pyproj",
    "lxml",
    "utm",
    "torch>=2.2",
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "albumentations>=1.4",
    "geographiclib>=2.0",
    "pymap3d>=3.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black>=24.0",
]

[project.scripts]
mission-partitioner = "mission_partitioner.run_partitioner:main"
vision-model-train = "vision_model.cli.train:main"
vision-model-infer = "vision_model.cli.infer:main"
vision-model-infer-video = "vision_model.cli.infer_video:main"
vision-model-geotag = "vision_model.cli.geotag:main"
vision-model-evaluate = "vision_model.cli.evaluate:main"

[tool.setuptools]
packages = [
    "mission_partitioner",
    "vision_model",
]

[tool.setuptools.package-dir]
"" = "."
"vision_model" = "vision_model/src/vision_model"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort