# Detector backend configuration, consumed by models.registry.build_detector.
name: yolo
model_path: yolov8n.pt  # pretrained checkpoint to fine-tune from, or a
                        # previously saved runs/<run>/last.pt to resume from
device: cuda            # "auto" | "cpu" | "cuda:0" | ...

class_map:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor

# Defaults for inference.Predictor; overridable per-call.
confidence_threshold: 0.25
iou_threshold: 0.5
