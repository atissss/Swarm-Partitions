[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mission-partitioner"
version = "0.1.0"
description = "Voronoi-based UAV mission area partitioner with KML input and JSON output."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "shapely",
    "scikit-learn",
    "pyproj",
    "lxml",
    "utm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
mission-partitioner = "mission_partitioner.run_partitioner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mission_partitioner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, isort